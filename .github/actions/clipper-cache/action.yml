name: Clipper volume cache (mount)
description: >
  Lazily mount a clipper volume as the cargo target dir, with branch->main
  tag fallback. Cold start (no tags exist yet) degrades to a plain directory;
  the push step seeds the tag either way. Pair with explicit push/unmount
  steps at the end of the job (composite actions cannot have post steps).

  No mtime games: a fresh checkout's "now" mtimes make cargo conservatively
  re-verify the workspace crates (registry deps are content-fingerprinted and
  unaffected), and CARGO_INCREMENTAL=1 on the jobs makes that re-verification
  cheap. Conservative-and-incremental is both correct (no stale reuse in any
  direction) and fast; the cache's job is transporting the incremental state.

inputs:
  key:
    description: Cache lineage key, typically the job name (plus arch for matrices).
    required: true
  repo:
    description: Registry repository holding the cache tags.
    required: false
    default: clipper.dev/clipper/smolvm-ci-cache-v3

runs:
  using: composite
  steps:
    - name: Install clipper
      uses: clipper-registry/setup-clipper@main

    - name: Mount target cache
      shell: bash
      env:
        CACHE_REPO: ${{ inputs.repo }}
        CACHE_KEY: ${{ inputs.key }}
      run: |
        set -uo pipefail
        REF="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
        REF="${REF//\//-}"
        BRANCH_TAG="$CACHE_REPO:$CACHE_KEY-$REF"
        BASE_TAG="$CACHE_REPO:$CACHE_KEY-main"
        echo "CLIPPER_CACHE_TAG=$BRANCH_TAG" >> "$GITHUB_ENV"
        mkdir -p target
        if clipper volume mount target -j 16 "$BRANCH_TAG" "$BASE_TAG"; then
          echo "mounted cache (fallback order: $BRANCH_TAG, $BASE_TAG)"
        else
          echo "no cache tag found; cold start (push will seed $BRANCH_TAG)"
        fi
